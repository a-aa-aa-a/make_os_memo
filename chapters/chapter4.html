    <link rel="stylesheet" href="/make_os_memo/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.css">
    <script src="/make_os_memo/highlight/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
          // コードハイライト
          hljs.highlightAll();
          // 行番号追加
          hljs.initLineNumbersOnLoad();
        
          // 各コードブロックにコピーボタンを追加
          document.querySelectorAll("pre code").forEach((block) => {
            const pre = block.parentElement;
            const container = document.createElement("div");
            container.classList.add("code-container");
        
            // preをcode-containerの中へ移動
            pre.parentNode.insertBefore(container, pre);
            container.appendChild(pre);
        
            // コピーボタン作成
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "Copy";
            btn.className = "copy-btn";
            btn.addEventListener("click", () => {
              navigator.clipboard.writeText(block.innerText).then(() => {
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = "Copy", 1500);
              });
            });
        
            container.appendChild(btn);
          });
        });
    </script>

</head>
